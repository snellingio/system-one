[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[project]
name = "system-one-lite"
version = "0.1.0"
description = "Schema-constrained decisions using a local MLX language model"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
labeling = [
    "httpx>=0.28.1",
]
nli = [
    "torch>=2.9.0",
    "transformers>=5.15.0",
]
ocean = [
    "numpy>=2.5.3",
]
dev = [
    { include-group = "test" },
    { include-group = "labeling" },
    { include-group = "ocean" },
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
